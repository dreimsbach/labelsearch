services:
  labelsearch:
    build: .
    image: label-release-tracker:latest
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      NODE_ENV: "production"
      MB_USER_AGENT: "example-app/0.0.0"
      LOG_FILE_PATH: "/app/logs/app.log"
      CACHE_FILE_PATH: "/app/data/cache.json"
    volumes:
      - labelsearch-data:/app/data

volumes:
  labelsearch-data:
